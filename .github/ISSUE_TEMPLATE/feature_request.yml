name: Feature request
description: Propose a new capability or an improvement
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Report security vulnerabilities through the [private reporting form](https://github.com/package-broker/broker/security/advisories/new), not through an issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: ecosystem
    attributes:
      label: Ecosystem
      options:
        - Composer
        - npm
        - Both
        - Not ecosystem-specific
    validations:
      required: true
