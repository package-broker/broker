name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      full: ${{ steps.select.outputs.full }}
      clientMatrix: ${{ steps.select.outputs.clientMatrix }}
      uiBrowser: ${{ steps.select.outputs.uiBrowser }}
      smokeCloudflare: ${{ steps.select.outputs.smokeCloudflare }}
      smokeNode: ${{ steps.select.outputs.smokeNode }}
      treeshake: ${{ steps.select.outputs.treeshake }}
      pack: ${{ steps.select.outputs.pack }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            node scripts/ci-scope.mjs --full < /dev/null
          else
            git diff --no-renames --name-only -z "$BASE_SHA"..."$HEAD_SHA" | node scripts/ci-scope.mjs --head-branch "$HEAD_BRANCH"
          fi

  install:
    name: install
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  pr-meta:
    name: pr meta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          printf '%s\n' "$PR_TITLE" | grep -Eq "$pattern" || {
            echo "PR title must follow Conventional Commits"; exit 1; }

  typecheck:
    name: typecheck
    needs: [scope, install]
    if: needs.scope.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGES: ${{ needs.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-scope.mjs --check typecheck

  lint:
    name: lint
    needs: [scope, install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGES: ${{ needs.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-scope.mjs --check lint

  unit:
    name: unit (${{ matrix.node }}, shard ${{ matrix.shard }}/2)
    needs: [scope, install]
    if: needs.scope.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGES: ${{ needs.scope.outputs.packages }}
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-scope.mjs --check unit --passWithNoTests --shard=${{ matrix.shard }}/2 --exclude '**/test-support/**' --exclude '**/*.browser.test.ts'
      - if: matrix.shard == 1 && needs.scope.outputs.full == 'true'
        run: |
          pnpm test:scripts
          node --test scripts/ci-scope.test.mjs

  build:
    name: build
    needs: [scope, install]
    if: needs.scope.outputs.smokeCloudflare == 'true' || needs.scope.outputs.smokeNode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [cloudflare, node]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          pnpm openapi:sync
          git diff --exit-code -- packages/ui/openapi.json packages/ui/src/api-types.ts
      - env:
          TARGET: ${{ matrix.target }}
        run: pnpm pb build --config broker.config.ts --target "$TARGET"
      - env:
          TARGET: ${{ matrix.target }}
        if: (matrix.target == 'cloudflare' && needs.scope.outputs.smokeCloudflare == 'true') || (matrix.target == 'node' && needs.scope.outputs.smokeNode == 'true')
        run: pnpm smoke:"$TARGET"

  ui-e2e:
    name: ui-e2e
    needs: [scope, install]
    if: needs.scope.outputs.uiBrowser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bundle
      - run: pnpm --filter @package-broker/e2e exec playwright install --with-deps chromium
      - run: pnpm check:ui-browser
        env:
          PB_UI_BROWSER_REQUIRED: '1'
      - run: CI=true node packages/e2e/scripts/ui-e2e.mjs

  treeshake:
    name: treeshake
    needs: [scope, install]
    if: needs.scope.outputs.treeshake == 'true' || needs.scope.outputs.pack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: needs.scope.outputs.treeshake == 'true'
        run: pnpm check:treeshake
      - if: needs.scope.outputs.pack == 'true'
        run: pnpm check:pack

  client-matrix:
    name: client matrix (${{ matrix.client.name }}, Node ${{ matrix.node }})
    needs: [scope, install]
    if: needs.scope.outputs.clientMatrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        client:
          - { name: composer, version: '2.10' }
          - { name: npm, version: '11.17.0' }
          - { name: pnpm, version: '12.5.1' }
          - { name: yarn, version: '4.9.2' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install pinned real clients (npm bundles npm-packlist 10.0.4)
        run: npm install --global --force npm@11.17.0 @yarnpkg/cli-dist@4.9.2
      - name: Install pinned Composer
        if: matrix.client.name == 'composer'
        run: |
          curl -fsSLo composer.phar https://getcomposer.org/download/2.10.3/composer.phar
          echo '7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  composer.phar' | sha256sum --check --strict
          sudo install -m 0755 composer.phar /usr/local/bin/composer
          rm composer.phar
          composer --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test scripts/client-matrix.test.mjs
      - name: Require live re-pack parity against pinned npm
        if: matrix.client.name == 'npm'
        run: pnpm vitest run --project core src/registry/npm/tarball-pack.test.ts
        env:
          PB_NPM_PARITY_REQUIRED: '1'
      - run: pnpm client-matrix
        env:
          CLIENT: ${{ matrix.client.name }}
          CLIENT_VERSION: ${{ matrix.client.version }}

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a Signed-off-by trailer on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          for sha in $(git rev-list --no-merges "$base".."$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "add the trailer with: git commit -s (or git rebase --signoff)"; exit 1; }

  commit-gate:
    name: commit gate
    if: always()
    needs:
      [scope, install, pr-meta, dco, typecheck, lint, unit, build, ui-e2e, treeshake, client-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require selected jobs to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module -e '
            import { commitGate } from "./scripts/ci-scope.mjs";
            if (!commitGate(JSON.parse(process.env.NEEDS), { eventName: process.env.EVENT_NAME })) process.exit(1);
          '
