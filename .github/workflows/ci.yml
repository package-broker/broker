name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  pr-meta:
    name: pr meta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          printf '%s\n' "$PR_TITLE" | grep -Eq "$pattern" || {
            echo "PR title must follow Conventional Commits"; exit 1; }

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: unit (${{ matrix.node }}, shard ${{ matrix.shard }}/2)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/2
      - if: matrix.shard == 1
        run: pnpm test:scripts

  build:
    name: build
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [cloudflare, node]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          pnpm openapi:sync
          git diff --exit-code -- packages/ui/openapi.json packages/ui/src/api-types.ts
      - env:
          TARGET: ${{ matrix.target }}
        run: pnpm pb build --config broker.config.ts --target "$TARGET"
      - env:
          TARGET: ${{ matrix.target }}
        run: pnpm smoke:"$TARGET"

  ui-e2e:
    name: ui-e2e
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bundle
      - run: pnpm --filter @package-broker/e2e exec playwright install --with-deps chromium
      - run: pnpm check:ui-browser
        env:
          PB_UI_BROWSER_REQUIRED: '1'
      - run: CI=true node packages/e2e/scripts/ui-e2e.mjs

  treeshake:
    name: treeshake
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:treeshake
      - run: pnpm check:pack

  client-matrix:
    name: client matrix (${{ matrix.client.name }}, Node ${{ matrix.node }})
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        client:
          - { name: composer, version: '2.10' }
          - { name: npm, version: '11.17.0' }
          - { name: pnpm, version: '12.5.1' }
          - { name: yarn, version: '4.9.2' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install pinned real clients (npm bundles npm-packlist 10.0.4)
        run: npm install --global --force npm@11.17.0 @yarnpkg/cli-dist@4.9.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        if: matrix.client.name == 'composer'
        with:
          php-version: '8.4'
          tools: composer:2.10
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test scripts/client-matrix.test.mjs
      - name: Require live re-pack parity against pinned npm
        if: matrix.client.name == 'npm'
        run: pnpm vitest run --project core src/registry/npm/tarball-pack.test.ts
        env:
          PB_NPM_PARITY_REQUIRED: '1'
      - run: pnpm client-matrix
        env:
          CLIENT: ${{ matrix.client.name }}
          CLIENT_VERSION: ${{ matrix.client.version }}

  dco:
    name: dco
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a Signed-off-by trailer on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          for sha in $(git rev-list --no-merges "$base".."$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "add the trailer with: git commit -s (or git rebase --signoff)"; exit 1; }

  commit-gate:
    name: commit gate
    if: always()
    needs: [install, pr-meta, dco, typecheck, lint, unit, build, ui-e2e, treeshake, client-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) echo "failed: $RESULTS"; exit 1 ;; esac
          done
