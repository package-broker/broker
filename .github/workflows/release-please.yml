name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      paths_released:
        description: JSON array of released paths to (re)publish
        required: true
        type: string
      dry_run:
        description: Rehearse packing and npm publishing without credentials
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    name: release please
    permissions:
      contents: write # creates the release tags and GitHub Releases
      pull-requests: write # opens and updates the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build release tarballs
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PATHS_RELEASED: ${{ github.event_name == 'workflow_dispatch' && inputs.paths_released || needs.release-please.outputs.paths_released }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-tags: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm bundle
      - run: pnpm stage:prebuilt --check-reproducible --write-cli-expected
      - run: pnpm check:pack && pnpm check:treeshake && pnpm test:scripts
      - run: pnpm smoke:node && pnpm smoke:cloudflare && pnpm smoke:prebuilt
      - name: Pack release tarballs
        if: ${{ !inputs.dry_run }}
        run: node scripts/publish-packages.mjs --pack-only .pb/publish-tarballs
      - name: Pack rehearsal tarballs
        if: inputs.dry_run
        run: |
          node --input-type=module > "$RUNNER_TEMP/rehearsal-tags.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('release-please-config.json'));
          const tags = Object.entries(config.packages).map(([path, { component }]) => {
            const { version } = JSON.parse(readFileSync(`${path}/package.json`));
            return `${component}-v${version}`;
          });
          console.log(JSON.stringify(tags));
          NODE
          node scripts/publish-packages.mjs --dry-run --tags-file "$RUNNER_TEMP/rehearsal-tags.json" --pack-only .pb/publish-tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: .pb/publish-tarballs/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: .pb/publish-tarballs
      - run: node scripts/publish-packages.mjs --from-tarballs .pb/publish-tarballs

  publish-dry-run:
    name: publish dry run
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: .pb/publish-tarballs
      - run: node scripts/publish-packages.mjs --dry-run --from-tarballs .pb/publish-tarballs
