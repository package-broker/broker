receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch: {}

exporters:
  nop: {}
  otlp/graylog:
    endpoint: graylog.example.internal:4317
    tls:
      ca_file: ${env:GRAYLOG_CA_FILE}

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/graylog]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop]
