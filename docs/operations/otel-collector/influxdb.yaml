receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch: {}
  deltatocumulative: {}

exporters:
  nop: {}
  influxdb:
    endpoint: https://influxdb.example.internal:8086
    org: ${env:INFLUXDB_ORG}
    bucket: ${env:INFLUXDB_BUCKET}
    token: ${env:INFLUXDB_TOKEN}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, deltatocumulative, batch]
      exporters: [influxdb]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop]
