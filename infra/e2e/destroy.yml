---
- name: Delete only recorded and ownership-verified Hetzner resource ids
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Require a concrete run id and real execution
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - e2e_run_id is match('^[a-z0-9][a-z0-9-]{7,39}$')
          - lookup('ansible.builtin.env', 'HCLOUD_TOKEN') | length > 0
        quiet: true
      no_log: true

    - name: Read the recorded inventory without discovering resources
      ansible.builtin.set_fact:
        e2e_state: "{{ lookup('ansible.builtin.file', e2e_inventory_file) | from_json }}"
        e2e_cleanup_errors: []
        e2e_destroy_started_at: "{{ lookup('ansible.builtin.pipe', 'date +%s') | int }}"

    - name: Validate the journal identity and allowed resource kinds
      ansible.builtin.assert:
        that:
          - e2e_state.schema == 1
          - e2e_state.run_id == e2e_run_id
          - e2e_state.expires_at | string is match('^[1-9][0-9]*$')
          - e2e_state.resources is mapping
          - e2e_state.resources.keys() | difference(['servers', 'volumes', 'primary_ips', 'firewalls']) | length == 0
        quiet: true

    - name: Refuse malformed ids before contacting the API
      ansible.builtin.assert:
        that:
          - item.value is not mapping
          - (item.value if item.value is sequence and item.value is not string else [item.value]) | map('string') | reject('match', '^[1-9][0-9]*$') | list | length == 0
          - item.value is not sequence or item.value | length > 0
        quiet: true
      loop: '{{ e2e_state.resources | dict2items }}'
      loop_control:
        label: '{{ item.key }}'

    - name: Attempt every resource in dependency order
      ansible.builtin.include_tasks: tasks/delete-kind.yml
      loop:
        - { kind: servers, object: server }
        - { kind: volumes, object: volume }
        - { kind: primary_ips, object: primary_ip }
        - { kind: firewalls, object: firewall }
      loop_control:
        loop_var: e2e_delete
        label: '{{ e2e_delete.kind }}'
      when: e2e_delete.kind in e2e_state.resources

    - name: Append non-secret teardown evidence while preserving all ids
      ansible.builtin.set_fact:
        e2e_state: >-
          {{ e2e_state | combine({'destroy_history': (e2e_state.destroy_history | default([])) + [{
          'started_at': e2e_destroy_started_at | int,
          'finished_at': lookup('ansible.builtin.pipe', 'date +%s') | int,
          'failed_kinds': e2e_cleanup_errors,
          'all_recorded_ids_absent': e2e_cleanup_errors | length == 0
          }]}) }}

    - name: Save teardown evidence
      ansible.builtin.include_tasks: tasks/record.yml

    - name: Remove local source transport and host trust file
      ansible.builtin.file:
        path: '{{ e2e_run_dir }}/{{ item }}'
        state: absent
      loop: [known_hosts, candidate-source.tar]

    - name: Fail if any resource could not be confirmed absent
      ansible.builtin.assert:
        that: e2e_cleanup_errors | length == 0
        fail_msg: 'Cleanup could not confirm absence for: {{ e2e_cleanup_errors | join(", ") }}. Retry destroy with the retained journal.'
