---
- name: Verify ownership and delete one recorded id
  block:
    - name: Read this exact id without a collection or name search
      ansible.builtin.uri:
        url: 'https://api.hetzner.cloud/v1/{{ e2e_delete.kind }}/{{ e2e_delete_id }}'
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.env', 'HCLOUD_TOKEN') }}"
        method: GET
        status_code: [200, 404]
        return_content: true
        follow_redirects: none
        use_proxy: false
        timeout: 30
      register: e2e_existing
      no_log: true

    - name: Refuse foreign ids even when the journal points at them
      ansible.builtin.assert:
        that:
          - e2e_existing.json[e2e_delete.object].labels.pb_e2e | default('') == 'true'
          - e2e_existing.json[e2e_delete.object].labels.run_id | default('') == e2e_state.run_id
          - e2e_existing.json[e2e_delete.object].labels.expires_at | default('') == e2e_state.expires_at | string
        quiet: true
      when: e2e_existing.status == 200
      no_log: true

    - name: Delete the verified id and retry transient attachment locks
      ansible.builtin.uri:
        url: 'https://api.hetzner.cloud/v1/{{ e2e_delete.kind }}/{{ e2e_delete_id }}'
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.env', 'HCLOUD_TOKEN') }}"
        method: DELETE
        status_code: [200, 204, 404]
        follow_redirects: none
        use_proxy: false
        timeout: 30
      register: e2e_deleted
      until: e2e_deleted.status in [200, 204, 404]
      retries: 20
      delay: 3
      changed_when: e2e_deleted.status in [200, 204]
      when: e2e_existing.status == 200
      no_log: true

    - name: Require confirmed absence of this exact id
      ansible.builtin.uri:
        url: 'https://api.hetzner.cloud/v1/{{ e2e_delete.kind }}/{{ e2e_delete_id }}'
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.env', 'HCLOUD_TOKEN') }}"
        method: GET
        status_code: 404
        follow_redirects: none
        use_proxy: false
        timeout: 30
      register: e2e_absent
      until: e2e_absent.status == 404
      retries: 30
      delay: 2
      no_log: true
  rescue:
    - name: Retain a safe failure marker and continue with remaining ids
      ansible.builtin.set_fact:
        e2e_cleanup_errors: '{{ e2e_cleanup_errors + [e2e_delete.kind] }}'
