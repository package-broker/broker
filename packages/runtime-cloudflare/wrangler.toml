name = "package-broker"
main = "../../.pb/cloudflare/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Operator template. Bindings are created by name at deploy time and no
# account or resource ids are committed. Every <deployment> placeholder must be
# resolved before deploying; unresolved placeholders do not deploy.
# Workers Paid is required (Queues). The binding and variable names below are
# the ones broker.config.ts and the runtime read: DB, STORAGE, JOBS, ANALYTICS
# and DEPLOYMENT_ID.
# EU jurisdiction applies to D1 and R2 and is fixed at creation time (ADR-020).
# It does not make Workers, Cache API, Queues, logs or Analytics Engine
# EU-resident.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "<database-name>"
#
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "<deployment>-blobs"
# jurisdiction = "eu"
#
# [[queues.producers]]
# binding = "JOBS"
# queue = "<deployment>-jobs"
#
# [[queues.consumers]]
# queue = "<deployment>-jobs"
# max_batch_size = 1
# max_batch_timeout = 1
# max_retries = 4
# max_concurrency = 2
# dead_letter_queue = "<deployment>-jobs-dlq"
#
# No consumer is registered for the dead-letter queue: failed messages stay
# there for operator inspection and replay.
#
# [triggers]
# crons = ["* * * * *"]
#
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "<deployment>_metrics"
#
# Required when MCP is enabled. Limits are keyed by the token selector.
# [[unsafe.bindings]]
# name = "MCP_RATE_LIMIT"
# type = "ratelimit"
# namespace_id = "<mcp-rate-limit-namespace-id>"
# simple = { limit = 60, period = 60 }
#
# [vars]
# DEPLOYMENT_ID = "<deployment>"
#
# [observability]
# enabled = true
#
# [observability.logs]
# enabled = true
# invocation_logs = false
#
# [assets]
# binding = "ASSETS"
# directory = "../../.pb/cloudflare/assets"
# run_worker_first = true
# html_handling = "none"
# not_found_handling = "none"
